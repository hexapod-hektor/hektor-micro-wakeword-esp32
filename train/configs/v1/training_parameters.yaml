window_step_ms: 10
train_dir: ${HK_WORK}/trained/v1
features:
- features_dir: ${HK_WORK}/features/pos_main
  sampling_weight: 2.0
  penalty_weight: 1.0
  truth: true
  truncation_strategy: truncate_start
  type: mmap
- features_dir: ${HK_WORK}/features/pos_live
  sampling_weight: 0.00624
  penalty_weight: 1.0
  truth: true
  truncation_strategy: truncate_start
  type: mmap
- features_dir: ${HK_WORK}/features/neg_other
  sampling_weight: 4.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: ${HK_WORK}/features/neg_piper
  sampling_weight: 2.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: ${HK_WORK}/negative_datasets/speech
  sampling_weight: 10.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: ${HK_WORK}/negative_datasets/dinner_party
  sampling_weight: 10.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: ${HK_WORK}/negative_datasets/no_speech
  sampling_weight: 5.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: random
  type: mmap
- features_dir: ${HK_WORK}/negative_datasets/dinner_party_eval_1h
  sampling_weight: 0.0
  penalty_weight: 1.0
  truth: false
  truncation_strategy: split
  type: mmap
training_steps:
- 20000
positive_class_weight:
- 1.5
negative_class_weight:
- 1.0
learning_rates:
- 0.001
batch_size: 128
time_mask_max_size:
- 5
time_mask_count:
- 2
freq_mask_max_size:
- 5
freq_mask_count:
- 2
eval_step_interval: 500
clip_duration_ms: 1500
target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall
